<h2><a name="Main"></a></h2>
<! --- popis mise s odkazy na markery>
<h6>
<B>May 14, 1985</B> – 我们要离开这里了。而且，多么幸运的突破，我将驾驶一辆卡车，作为第一批车队从我们区域出发。我等不及要离开这个岛了。
好吧，我们是挨了一顿揍——但至少我能活着离开……
</h6>
<! --- konec popisu mise>

<hr>
<! --- podrobný plán mise step-by-step>
<p><a name="plan"></a>
Montignac的灾难之后，敌人占据了上风。北约决定完全撤出Everon，在Malden上重新集结。
你要去Morton撤离该岛。
<br><br>
你和指挥官从<A HREF="marker:start">这里的吉普车</A>出发，在Le Moule附近。
</p>
<hr>

<p><a name = "OBJ_1"></a>作为司机进入<A HREF="marker:nalozeni">卡车</A>。
</p>
<hr>

<p><a name = "OBJ_2"></a>开车前往<A HREF="marker:puvodnicil">Morton</A>。
</p>
<hr>

<p><a name = "OBJ_3"></a>在<A HREF="marker:puvodnicil">Morton</A>做好准备，撤离Everon岛。
</p>
<hr>

<p><a name = "OBJ_4"></a>前往道路右侧的<A HREF="marker:farma">农场</A>。检查情况并消灭所有敌军单位。
</p>
<hr>

<p><a name = "OBJ_5"></a>抵达<A HREF="marker:tabor">新的美军秘密撤离点</A>。它在Morton以北。
</p>
<hr>
