<h6>
<B>May 14, 1985</B> – 我独自一人。迷失在敌后。我小队的其余人……被屠杀了。电台似乎坏了。敌人从四面八方涌来。没有可用的交通工具，北约正在从Everon撤离。
天呐，我得离开这里。我得前往Morton与我们的部队会合。但这可不容易。
好吧，豁出去了……
</h6>
