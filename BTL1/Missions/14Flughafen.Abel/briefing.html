<h2><a name="main"></a>Do. 29.04.01</h2>

<h6>
今天，我们的任务是把St. Luis北部的机场变成一堆无用的碎石。当前，敌人的援军正涌向Melden以弥补遭受的损失。如果我们破坏了跑道，那他们一切都完了.
<br>
Roos<br>
</h6>

<hr>
<! --- podrobn?pl醤 mise step-by-step>
<p><a name="plan"></a>你将乘着偷来的敌人卡车进入机场。哨兵会以为是新补给而为你放行。开着你的卡车到 <a href="marker:wache1">第一哨口</a>并消灭所有的警卫。由于换岗，大多数警卫没有上岗，使你活动更为方便。前往<a href="marker:wache2">第二哨口</a>并杀死所有警卫。你现在就能在机场上埋设地雷了。
<p></p>

<p></p>
<hr>
<p></p>

<p><a name = "OBJ_0"></a>控制机场并在机场跑道上埋设地雷，切断敌人的一切空中供给.</p>
<p></p>
<hr>


<! --- konec pl醤u>

<h2><p><a name="Debriefing:End1">胜利了! </a></p></h2>
<br>
<p>
干得好，同志.跑道上全是地雷,它对飞机来说已经没用了.这会对敌人造成后勤补给困难,使我们在未来的战斗中更有优势.
</p>
<br>
