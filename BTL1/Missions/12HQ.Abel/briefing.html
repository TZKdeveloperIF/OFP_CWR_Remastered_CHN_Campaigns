<h2><a name="main"></a>Mi. 28.04.01</h2>

<h6>
敌人的攻势未能被阻止。他们逐日向前推进，现在，他们何时到达我们的基地只是一个时间问题了。为了使我们有额外的时间来逃走，我自愿去执行一个特殊的任务，在通往基地的道路上埋设地雷以阻击他们的前进.
<br>
Roos
</h6>

<hr>
<! --- podrobn?pl醤 mise step-by-step>
<p><a name="plan"></a>登上你的PV3S,向南方开去。一旦找到合适的位置，设好埋伏等待敌人。争取到的片刻时间对于我们基地的撤退也许是生死攸关的。
<p></p>

<p></p>
<hr>
<p></p>

<p><a name = "OBJ_0"></a>找到伏击的合适地点.
</p>
<hr>
<p><a name = "OBJ_1"></a>保卫你的阵地直到基地撤离.
</p>
<hr>
<p><a name = "OBJ_2"></a>在往北<a href="marker:treffpunkt">连接基地的公路</a>上阻击敌人.
</p>
<hr>


<! --- konec pl醤u>

<p><a name="Debriefing:End1">成功撤离!</a></p>
<br>
<p>
我们获得了足够使我们车队往西撤离的时间.我们的新目标是La Trinite.
</p>

<br>
<br>

<br>
<p>

</p>
