<h6><a name="Main"></a>
<p>
我厌倦了这一切。我真是受够了，多想回家。今天不得不以费季卡的名义给普赞采夫的母亲写信。我大概是个懦夫，没法告诉她儿子的死讯。
<br>
但总有一天必须这么做，而我最怕的就是那一刻。
<br><br>
1985年5月7日。
</p>
</h6>
<hr>
<! --- Конец заметкам -->

<! --- ----------------------------->
<! --- План миссии                  >
<! --- ----------------------------->
<p><a name="plan"></a>
攻占 <a href="Marker:aerp">机场</a>并置于我方控制之下，是当前局势下最重要的任务。增援已经从本土起飞，我们必须准备好迎接它的跑道，并确保其安全。
</p>
<br>
<br>
任务：
<hr>

<p><a name = "OBJ_0"></a>掌控机场。
</p>
<hr>

<p><a name = "OBJ_1"></a>准备好机场，以迎接来自本土的增援。
</p>
<hr>

<p><a name = "OBJ_2"></a>阻击敌人，直到援军抵达。
</p>
<hr>

<p><a name = "OBJ_3"></a>清剿机场内的敌军士兵。
</p>
<hr>
<! --- Конец плана миссий -->

<hr>
<br>
<h2><a name="Debriefing:End1">任务成功</a></h2>
<br>
<p>
机场已被苏军控制。
</p>

<hr>
<br>
<h2><a name="Debriefing:End6">任务失败</a></h2>
<br>
<p>
你犯下了残忍的罪行。现在军事法庭将审判你。
</p>
